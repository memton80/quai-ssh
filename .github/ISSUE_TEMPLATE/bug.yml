# Formulaire ouvert par le bouton « Idée ou bug » de Quai SSH : les identifiants des champs (id) sont remplis par
# l'adresse (src/Quai.Core/ViewModels/FeedbackViewModel.cs). Ne pas les renommer sans changer l'application.
name: Signaler un bug
description: Quelque chose ne marche pas comme prévu dans Quai.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Ce qui s'est passé, et ce que vous attendiez
      description: Message d'erreur, comportement inattendu…
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: systeme
    attributes:
      label: Version de Quai SSH et de Windows
      render: text
  - type: markdown
    attributes:
      value: |
        Pour aider au diagnostic, vous pouvez glisser le journal du jour (`%LOCALAPPDATA%\Quai\logs`) dans un des champs ci-dessus.
        Relisez-le avant : il contient les noms de vos serveurs (jamais de mot de passe).
