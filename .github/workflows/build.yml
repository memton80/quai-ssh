name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Quai.sln'
      - 'Directory.*'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Quai.sln'
      - 'Directory.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # À ajuster selon la LTS supportée par le Windows App SDK utilisé
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Quai.sln

      - name: Tests (Quai.Core)
        if: matrix.platform == 'x64'
        run: dotnet test tests/Quai.Core.Tests/Quai.Core.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/Quai.App/Quai.App.csproj
          -c Release
          -r win-${{ matrix.platform }}
          --self-contained true
          -p:Platform=${{ matrix.platform }}
          -p:WindowsPackageType=None
          -o publish/${{ matrix.platform }}

      - name: Zip
        run: Compress-Archive -Path publish/${{ matrix.platform }}/* -DestinationPath Quai-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Quai-${{ matrix.platform }}
          path: Quai-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
