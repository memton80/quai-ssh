name: Build

on:
  push:
    branches: [main]
    # Tag poussé à la main (les releases sont normalement créées toutes seules, voir le job « version »).
    tags: ['v*', 'V*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Quai.sln'
      - 'Directory.*'
      - 'global.json'
      - 'installer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Quai.sln'
      - 'Directory.*'
      - 'global.json'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish_args:
        description: "Essai : propriétés MSBuild ajoutées à la publication (ex. -p:PublishTrimmed=false). Jamais publié en release."
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Version de la construction et décision de publier.
  # La version se prépare dans Directory.Build.props (<Version>X.Y.Z</Version>). Quand elle arrive sur main sans
  # tag correspondant, ce run la construit, puis le job « release » crée le tag vX.Y.Z et publie la release.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Version et publication
        id: version
        shell: bash
        env:
          PUBLISH_ARGS: ${{ inputs.publish_args }}
        run: |
          set -euo pipefail
          prepared=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)
          if ! [[ "$prepared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<Version> doit être de la forme X.Y.Z (trouvé : « $prepared »)."
            exit 1
          fi

          # Tag déjà présent ? Sans tenir compte de la casse du « v » (V1.0.0 a été créé à la main).
          tags=$(git ls-remote --tags origin)
          if grep -qiE "refs/tags/v${prepared//./\\.}$" <<<"$tags"; then tagged=true; else tagged=false; fi

          case "$GITHUB_REF" in
            refs/tags/[vV]*)
              version="${GITHUB_REF_NAME:1}"; tag="$GITHUB_REF_NAME"; release=true ;;
            refs/heads/main)
              if [ "$tagged" = false ]; then
                version="$prepared"; tag="v$prepared"; release=true
              else
                version="0.0.0-ci.$GITHUB_RUN_NUMBER"; tag=""; release=false
              fi ;;
            *)
              version="0.0.0-ci.$GITHUB_RUN_NUMBER"; tag=""; release=false ;;
          esac

          # Un essai avec des propriétés de publication en plus n'est jamais publié.
          if [ -n "$PUBLISH_ARGS" ]; then
            version="0.0.0-ci.$GITHUB_RUN_NUMBER"; tag=""; release=false
            echo "Essai de publication : $PUBLISH_ARGS" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Version préparée (Directory.Build.props) : **$prepared** — tag v$prepared déjà présent : **$tagged**"
            echo
            echo "Construction : **$version** — publication : **$release** ${tag:+(tag $tag)}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Version préparée $prepared (tag présent : $tagged) ; construction $version ; publication : $release"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # .NET 10 = dernière LTS, prise en charge par le Windows App SDK 2.x (voir docs/DECISIONS.md).
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Quai.sln

      - name: Tests (Quai.Core)
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/Quai.Core.Tests/Quai.Core.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        env:
          PUBLISH_ARGS: ${{ inputs.publish_args }}
        run: |
          $extra = @(if ($env:PUBLISH_ARGS) { $env:PUBLISH_ARGS -split '\s+' | Where-Object { $_ } })
          dotnet publish src/Quai.App/Quai.App.csproj `
            -c Release `
            -r win-${{ matrix.platform }} `
            --self-contained true `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None `
            -p:Version=${{ needs.version.outputs.version }} `
            -o publish/${{ matrix.platform }} `
            @extra
          if ($LASTEXITCODE -ne 0) { throw "La publication a échoué (code $LASTEXITCODE)." }

      - name: Vérification du contenu publié
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.platform }}"
          Get-ChildItem $dir | Sort-Object Name | Format-Table Name, Length -AutoSize | Out-String -Width 200
          $required = @(
            'Quai.exe', 'Quai.dll', 'Quai.Core.dll', 'Quai.pri', 'Microsoft.WinUI.dll', 'Renci.SshNet.dll', 'System.IO.Ports.dll',
            'Microsoft.Terminal.Control.dll', 'Assets/Quai.ico', 'Assets/AppIcon.png', 'Assets/Licenses/Windows-Terminal-LICENSE.txt',
            'fr-FR/Microsoft.ui.xaml.dll.mui', 'en-US/Microsoft.ui.xaml.dll.mui')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Fichiers manquants dans la publication : $($missing -join ', ')" }

          # Le terminal est le moteur natif de Windows Terminal : ni page web, ni WPF.
          # Allègement (voir docs/DECISIONS.md) : ni IA / ML / recherche / widgets du Windows App SDK, ni WebView2,
          # ni outils de diagnostic du runtime, ni langues de WinUI autres que le français et l'anglais.
          $forbidden = @(
            'Microsoft.Terminal.Wpf.dll', 'PresentationFramework.dll', 'Assets/Terminal',
            'onnxruntime.dll', 'DirectML.dll', 'Microsoft.Windows.AI.Text.dll', 'Microsoft.Windows.Search.dll', 'Microsoft.Windows.Widgets.dll', 'DWriteCore.dll',
            'Microsoft.Web.WebView2.Core.dll', 'WebView2Loader.dll', 'Microsoft.UI.Xaml/Assets/map.html',
            'createdump.exe', 'mscordbi.dll', 'mscordaccore.dll',
            'de-DE', 'ja-JP') | Where-Object { Test-Path (Join-Path $dir $_) }
          if ($forbidden) { throw "Fichiers inattendus dans la publication : $($forbidden -join ', ')" }

          # DLL du moteur : signature Microsoft valide et architecture de la publication.
          $engine = Join-Path $dir 'Microsoft.Terminal.Control.dll'
          $signature = Get-AuthenticodeSignature $engine
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Signature inattendue pour Microsoft.Terminal.Control.dll : $($signature.Status) / $($signature.SignerCertificate.Subject)"
          }
          $bytes = [IO.File]::ReadAllBytes($engine)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.platform }}']
          if ($machine -ne $expected) { throw ("Microsoft.Terminal.Control.dll : architecture 0x{0:X4}, attendu 0x{1:X4}" -f $machine, $expected) }
          "Moteur de terminal : signé par $($signature.SignerCertificate.Subject), architecture 0x$('{0:X4}' -f $machine)"

      - name: Zip (version portable)
        shell: pwsh
        run: 7z a -tzip -mx=9 "Quai-${{ matrix.platform }}.zip" "./publish/${{ matrix.platform }}/*"

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Host
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe (Inno Setup) introuvable.' }

          $version = '${{ needs.version.outputs.version }}'
          $numeric = ($version -split '-')[0]
          $source = (Resolve-Path 'publish/${{ matrix.platform }}').Path
          & $iscc /Qp "/DAppVersion=$version" "/DAppNumericVersion=$numeric" "/DArch=${{ matrix.platform }}" "/DSourceDir=$source" "/DOutputDir=$PWD" installer/Quai.iss
          if ($LASTEXITCODE -ne 0) { throw "La compilation de l'installateur a échoué (code $LASTEXITCODE)." }
          Get-Item 'Quai-Setup-${{ matrix.platform }}.exe', 'Quai-${{ matrix.platform }}.zip' |
            Select-Object Name, @{ n = 'Mo'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize | Out-String

      # Tailles dans le résumé du run, pour suivre le poids de l'application d'une version à l'autre.
      - name: Rapport de taille
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'
          $files = Get-ChildItem "publish/$arch" -Recurse -File
          $mb = { param($bytes) '{0:N1}' -f ($bytes / 1MB) }
          $installed = ($files | Measure-Object Length -Sum).Sum
          $setup = (Get-Item "Quai-Setup-$arch.exe").Length
          $zip = (Get-Item "Quai-$arch.zip").Length
          $largest = $files | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { "| $($_.FullName.Substring((Resolve-Path "publish/$arch").Path.Length + 1)) | $(& $mb $_.Length) |" }
          @(
            "### Taille ($arch)"
            ''
            '| | Mo |'
            '|---|---:|'
            "| Installée ($($files.Count) fichiers) | $(& $mb $installed) |"
            "| Installateur | $(& $mb $setup) |"
            "| Zip | $(& $mb $zip) |"
            ''
            '<details><summary>Fichiers les plus lourds</summary>'
            ''
            '| Fichier | Mo |'
            '|---|---:|'
            $largest
            ''
            '</details>'
            ''
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Installée : $(& $mb $installed) Mo ($($files.Count) fichiers) — installateur : $(& $mb $setup) Mo — zip : $(& $mb $zip) Mo"

      - name: Installation silencieuse
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $setup = (Resolve-Path 'Quai-Setup-x64.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "Installation en échec (code $($process.ExitCode))."
          }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Quai'
          $missing = 'Quai.exe', 'unins000.exe', 'Quai.pri', 'Microsoft.Terminal.Control.dll' | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Fichiers installés manquants : $($missing -join ', ')" }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F6C1C0E-5B0E-4F0B-9E57-3C7F2A9D51A4}_is1'
          if (-not (Test-Path $key)) { throw "Entrée de désinstallation absente du registre." }
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List | Out-String

          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Quai.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Raccourci du menu Démarrer absent.' }
          "QUAI_INSTALL_DIR=$dir" >> $env:GITHUB_ENV

      # Démarrage seul, cinq fois de suite : le premier lancement paie la lecture des fichiers et leur analyse par
      # l'antivirus, la médiane des suivants donne le démarrage habituel (à comparer avec prudence d'un run à l'autre :
      # les machines du CI varient de ±150 ms).
      - name: Démarrage (5 lancements)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'startup'
          $exe = Join-Path $env:QUAI_INSTALL_DIR 'Quai.exe'
          foreach ($i in 1..5) {
            $process = Start-Process -FilePath $exe -ArgumentList '--startup-probe', "`"$probe`"" -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Lancement $i : pas de premier rendu en 60 s." }
            if ($process.ExitCode -ne 0) { throw "Lancement $i : code de sortie $($process.ExitCode)." }
          }
          $times = @(Get-Content (Join-Path $probe 'startup-ms.txt') | ForEach-Object { [int]$_ })
          if ($times.Count -ne 5) { throw "Mesures de démarrage incomplètes : $($times -join ', ')" }
          $warm = @($times[1..4] | Sort-Object)
          $median = [int](($warm[1] + $warm[2]) / 2)
          $line = "Démarrage jusqu'au premier rendu : **$($times[0]) ms** au premier lancement, puis médiane **$median ms** ($($times[1..4] -join ', ') ms)"
          $line
          @('### Démarrage', '', $line, '') | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Remove-Item -Recurse -Force $probe

      # Les machines du CI (Windows Server) n'animent pas l'interface : sans animation, certains bugs d'affichage
      # (terminal en retard sur le volet de navigation) ne se produisent pas. On les active comme sur un poste.
      - name: Animations de Windows activées (comme sur un poste)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          Add-Type -Namespace Quai -Name Spi -MemberDefinition @'
          [DllImport("user32.dll", EntryPoint = "SystemParametersInfoW")] public static extern bool Get(uint action, uint param, ref bool value, uint flags);
          [DllImport("user32.dll", EntryPoint = "SystemParametersInfoW")] public static extern bool Set(uint action, uint param, IntPtr value, uint flags);
          '@
          $before = $false
          [void][Quai.Spi]::Get(0x1042, 0, [ref]$before, 0)   # SPI_GETCLIENTAREAANIMATION
          [void][Quai.Spi]::Set(0x1043, 0, [IntPtr]1, 3)       # SPI_SETCLIENTAREAANIMATION, enregistré et diffusé
          $after = $false
          [void][Quai.Spi]::Get(0x1042, 0, [ref]$after, 0)
          "Animations de l'interface : $before -> $after"

      - name: Test de fumée (application installée, lancement réel)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          $exe = Join-Path $env:QUAI_INSTALL_DIR 'Quai.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "`"$out`"" -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(240000)) {
            $process.Kill()
            Write-Host "::error::Le test de fumée n'a pas rendu la main en 240 s."
            $failed = $true
          } elseif ($process.ExitCode -ne 0) {
            Write-Host "::error::Le test de fumée a échoué (code $($process.ExitCode))."
            $failed = $true
          }
          if (Test-Path $out) { Get-ChildItem $out -File | Format-Table Name, Length -AutoSize | Out-String }
          if (Test-Path (Join-Path $out 'smoke-report.txt')) { Get-Content (Join-Path $out 'smoke-report.txt') }
          $metrics = Join-Path $out 'smoke-metrics.md'
          if (Test-Path $metrics) {
            Get-Content $metrics
            Get-Content $metrics | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if ($failed -or -not (Test-Path (Join-Path $out 'smoke-ok.txt'))) {
            if (Test-Path (Join-Path $out 'smoke-error.txt')) { Get-Content (Join-Path $out 'smoke-error.txt') }
            Get-ChildItem (Join-Path $out 'data/logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Select-Object -First 6 | ForEach-Object { $_.Message }
            throw 'Test de fumée en échec.'
          }

      # Le bouton « Mettre à jour » pour de vrai : Quai installé se voit proposer l'installateur qui vient d'être
      # construit (servi depuis le disque à la place de GitHub, avec sa vraie empreinte), le télécharge, le vérifie,
      # le lance en silencieux et se ferme ; l'installateur doit réussir et relancer Quai.
      - name: Mise à jour en place (téléchargement vérifié, installation silencieuse, relance)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'update'
          $exe = Join-Path $env:QUAI_INSTALL_DIR 'Quai.exe'
          $setup = (Resolve-Path 'Quai-Setup-x64.exe').Path
          $log = Join-Path $out 'data/logs/update-install.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--update-test', "`"$out`"", "`"$setup`"" -PassThru
          $null = $process.Handle
          $failure = $null
          $relaunched = $null
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            $failure = "Quai ne s'est pas fermé pour installer la mise à jour (120 s)."
          } elseif ($process.ExitCode -ne 0) {
            $failure = "Quai a quitté avec le code $($process.ExitCode) pendant la mise à jour."
          } else {
            $deadline = (Get-Date).AddSeconds(180)
            $done = $false
            while ((Get-Date) -lt $deadline) {
              $done = (Test-Path $log) -and (Select-String -Path $log -Pattern 'Installation process succeeded' -SimpleMatch -Quiet)
              $relaunched = @(Get-Process -Name Quai -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $process.ExitTime })
              if ($done -and $relaunched.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $done) { $failure = "L'installateur n'a pas terminé la mise à jour." }
            elseif ($relaunched.Count -eq 0) { $failure = "Quai n'a pas été relancé après la mise à jour." }
            else {
              # La nouvelle version sait qu'elle vient d'être relancée par l'installateur (--after-update).
              $marker = $false
              $deadline = (Get-Date).AddSeconds(30)
              while (-not $marker -and (Get-Date) -lt $deadline) {
                $marker = [bool](Get-ChildItem (Join-Path $out 'data/logs') -Filter 'quai-*.log' -ErrorAction SilentlyContinue |
                  Select-String -Pattern 'Démarrage juste après une mise à jour' -SimpleMatch -Quiet)
                if (-not $marker) { Start-Sleep -Seconds 1 }
              }
              if (-not $marker) { $failure = "Quai relancé sans l'indication « après une mise à jour »." }
            }
          }
          if (Test-Path $log) {
            # Lignes utiles du journal d'Inno Setup (pas la liste des fichiers copiés).
            Get-Content $log | Select-String -CaseSensitive -Pattern 'Setup command line:', 'RestartManager', 'Installation process', '-- Run entry --', 'Filename: ', 'Parameters: ', 'Process exit code' |
              ForEach-Object { $_.Line }
          }
          if ($relaunched) { $relaunched | Stop-Process -Force; Start-Sleep -Seconds 2 }
          if ($failure) {
            if (Test-Path (Join-Path $out 'smoke-error.txt')) { Get-Content (Join-Path $out 'smoke-error.txt') }
            Get-ChildItem (Join-Path $out 'data/logs') -Filter 'quai-*.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw $failure
          }
          $line = 'Mise à jour en place : installateur téléchargé et vérifié (SHA-256), installé en silencieux, Quai relancé : OK'
          $line
          @('### Mise à jour en place', '', $line, '') | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Captures du test de fumée
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/*.md
            ${{ runner.temp }}/smoke/data/logs/*.log
            ${{ runner.temp }}/update/*.png
            ${{ runner.temp }}/update/*.txt
            ${{ runner.temp }}/update/data/logs/*.log
            ${{ runner.temp }}/install.log
          if-no-files-found: ignore

      - name: Désinstallation silencieuse (avec effacement des données)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $dir = $env:QUAI_INSTALL_DIR
          $data = Join-Path $env:LOCALAPPDATA 'Quai'

          # Données factices : elles doivent disparaître avec /PURGE=1.
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'logs') | Out-Null
          Set-Content -Path (Join-Path $data 'connections.json') -Value '{ "version": 1, "connections": [] }'

          # Le commutateur utilisé par le désinstallateur pour vider le coffre Windows doit fonctionner.
          $purge = Start-Process -FilePath (Join-Path $dir 'Quai.exe') -ArgumentList '--purge-secrets' -PassThru -Wait
          if ($purge.ExitCode -ne 0) { throw "--purge-secrets a échoué (code $($purge.ExitCode))." }

          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PURGE=1' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation en échec (code $($uninstall.ExitCode))." }

          # Le désinstallateur termine son nettoyage depuis une copie temporaire : on laisse quelques secondes.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F6C1C0E-5B0E-4F0B-9E57-3C7F2A9D51A4}_is1'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Quai.lnk'
          $left = @()
          if (Test-Path $dir) { $left += "dossier d'installation ($((Get-ChildItem $dir -Recurse -File | Select-Object -First 5).FullName -join ', '))" }
          if (Test-Path $key) { $left += 'entrée du registre' }
          if (Test-Path $shortcut) { $left += 'raccourci du menu Démarrer' }
          if (Test-Path $data) { $left += 'données utilisateur' }
          if ($left) { throw "La désinstallation a laissé : $($left -join ' ; ')" }
          Write-Host 'Désinstallation complète : aucun fichier, raccourci ni entrée de registre restant.'

      - uses: actions/upload-artifact@v4
        with:
          name: Quai-${{ matrix.platform }}
          path: |
            Quai-${{ matrix.platform }}.zip
            Quai-Setup-${{ matrix.platform }}.exe
          if-no-files-found: error

  integration:
    name: Tests d'intégration SSH (OpenSSH réel) et série (socat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Serveur OpenSSH de test
        run: |
          tests/integration/start-sshd.sh "$RUNNER_TEMP/ssh.env"
          # Secrets jetables générés à l'instant : masqués dans les journaux.
          grep -E 'PASSWORD|PASSPHRASE' "$RUNNER_TEMP/ssh.env" | cut -d= -f2- | while read -r value; do echo "::add-mask::$value"; done
          cat "$RUNNER_TEMP/ssh.env" >> "$GITHUB_ENV"

      # Ports série virtuels (pseudo-terminaux) pour les tests du terminal série.
      - name: socat
        run: |
          command -v socat || { sudo apt-get update -q && sudo apt-get install -y -q socat; }
          socat -V | sed -n "1,2p"

      - name: Tests (Quai.Core, intégration comprise)
        run: dotnet test --project tests/Quai.Core.Tests/Quai.Core.Tests.csproj -c Release

  # Crée le tag (s'il n'existe pas encore) et la release, une fois tout vert.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Quai-*
          path: dist
          merge-multiple: true

      # Le tag est créé sur le commit construit s'il n'existe pas encore (créé par ce jeton, il ne relance pas le
      # workflow : la construction est déjà faite).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quai ${{ needs.version.outputs.version }}
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
